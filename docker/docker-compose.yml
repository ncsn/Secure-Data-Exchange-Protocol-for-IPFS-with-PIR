# 3-node baseline (BITSWAP_FLOOD_FORWARD=1, star topology, no chain hops):
#
#   bench(host) ──► owner
#                   owner ◄── peer1 (DHT participant)
#
# Flood forwarding is enabled but produces no extra hops here because there
# is no intermediate peer between bench and owner. This is the baseline for
# the scaling comparison.

services:
  owner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROLE=owner
      - PORT=4001
      - ANNOUNCE_IP=owner
      - BENCH_HMAC_KEY=bench-hmac-key-32-bytes-padding!!
      - BITSWAP_FLOOD_FORWARD=1
    ports:
      - "4001:4001"
    volumes:
      - shared:/shared

  peer1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROLE=peer
      - PORT=4002
      - ANNOUNCE_IP=peer1
      - OWNER_HOST=owner
      - OWNER_PORT=4001
      - BITSWAP_FLOOD_FORWARD=1
    ports:
      - "4002:4002"
    volumes:
      - shared:/shared
    depends_on:
      - owner

  requester:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROLE=requester
      - PORT=4003
      - ANNOUNCE_IP=requester
      - OWNER_HOST=owner
      - OWNER_PORT=4001
      - BITSWAP_FLOOD_FORWARD=1
    ports:
      - "4003:4003"
    volumes:
      - shared:/shared
    depends_on:
      - owner

volumes:
  shared:
