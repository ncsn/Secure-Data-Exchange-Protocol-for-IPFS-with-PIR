      - BITSWAP_FLOOD_FORWARD=1
    ports:
      - "4006:4006"
    volumes:
      - shared:/shared
    depends_on:
      - owner

  peer5:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROLE=peer
      - PORT=4007
      - ANNOUNCE_IP=peer5
      - OWNER_HOST=owner
      - OWNER_PORT=4001
      - BITSWAP_FLOOD_FORWARD=1
    ports:
      - "4007:4007"
    volumes:
      - shared:/shared
    depends_on:
      - owner

  peer6:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROLE=peer
