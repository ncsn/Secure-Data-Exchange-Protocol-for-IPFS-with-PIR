# Star scaling — 13 nodes (owner + 11 idle DHT peers + requester).
# All peers connect directly to the owner (no chain). Measures how DHT
# provider-lookup / discovery latency grows with network size.
#   docker compose -f docker-compose.yml -f docker-compose.star13.yml up --build

services:
  peer2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - ROLE=peer
      - PORT=4004
      - ANNOUNCE_IP=peer2
      - OWNER_HOST=owner
      - OWNER_PORT=4001
      - BITSWAP_FLOOD_FORWARD=1
    ports:
      - "4004:4004"
    volumes:
      - shared:/shared
    depends_on:
      - owner

  peer3:
    build:
